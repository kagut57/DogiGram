name: Sync Play Store updates

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: play-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            docs
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the Play Store listing
        run: python .github/scripts/play_updates.py

      - name: Commit new updates
        run: |
          if git diff --quiet -- docs/updates.json; then
            echo "Nothing new on the Play Store."
            exit 0
          fi
          git config user.name "dogigram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/updates.json
          git commit -m "Add the latest Play Store update to the site"
          git push
